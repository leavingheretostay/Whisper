    <!-- OneSignal Web Push -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "ce38b49f-559f-46b7-a2c9-3a0de79bea90",
          safari_web_id: "web.onesignal.auto.3d5e9a66-9429-4fce-a7e3-61aa58d6c253",
          notifyButton: {
            enable: true,
          },
        });
        OneSignal.User.PushSubscription.addEventListener('change', function(pushSubscription) {
          console.log("Push subscription state:", pushSubscription.current?.type);
        });
      });
    </script>

    <!-- Pushpad Web Push -->
    <script src="https://pushpad.xyz/pushpad.js" defer></script>
