<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whisper</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <meta property="og:title" content="Whisper">
    <meta property="og:description" content="Receive anonymous thoughts from the people who never say them aloud.">
    <meta property="og:image" content="https://9crwhisper.vercel.app/og_default.png">

    <!-- OneSignal Web Push -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "YOUR-ONE-SIGNAL-APP-ID",   // ← Replace with your actual OneSignal App ID
          notifyButton: {
            enable: true,
          },
          allowLocalhostAsSecureOrigin: false,
        });
        OneSignal.showSlidedown(); // optional – shows subscription prompt
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
